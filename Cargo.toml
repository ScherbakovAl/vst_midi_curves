[package]
name = "vst_midi_curves"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "VST3 плагин для обработки MIDI velocity с настраиваемыми кривыми Безье"
license = "MIT"
repository = "https://github.com/yourusername/vst_midi_curves"
keywords = ["vst3", "midi", "plugin", "rust", "daw"]
categories = ["multimedia::audio::plugins"]

[dependencies]
# VST плагин зависимости
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", features = ["vst3", "standalone"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug" }

# GUI зависимости для standalone
eframe = { version = "0.28", default-features = false, features = ["glow"] }
egui = "0.28"

# Общие зависимости
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
kurbo = "0.11"

# MIDI зависимости (для будущих версий)
cpal = "0.15"  # Для аудио/MIDI IO
midir = "0.8"  # Для MIDI портов

# Дополнительные зависимости
dirs = "5.0"   # Для работы с директориями конфигурации

[dev-dependencies]
tempfile = "3.0"   # Для временных файлов в тестах

# VST3 плагин библиотека
[lib]
name = "vst_midi_curves"
crate-type = ["cdylib", "rlib"]

# Standalone приложение
[[bin]]
name = "midi_curves"
path = "src/main.rs"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"

# Cross-compilation targets
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
