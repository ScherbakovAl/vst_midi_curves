[package]
name = "vst_midi_curves"
version = "0.1.0"
edition = "2021"
authors = ["Scherbakov Alexey <scherbakov.al@gmail.com>"]
description = "MIDI velocity curves (Note On / Note Off, 14-bit CC88): VST3/CLAP plugin and standalone app"
license = "MIT"
repository = "https://github.com/ScherbakovAl/vst_midi_curves"
keywords = ["vst3", "clap", "midi", "velocity", "plugin"]
categories = ["multimedia::audio::plugins"]

[dependencies]
# VST plugin dependencies
# Ревизия зафиксирована явно (Cargo.lock фиксирует её же).
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug", rev = "28b149ec4d62757d0b448809148a0c3ca6e09a95", features = ["vst3"] }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug", rev = "28b149ec4d62757d0b448809148a0c3ca6e09a95" }

# GUI standalone: тот же egui 0.31, что у nih_plug_egui (один стек egui)
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

# Common dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# MIDI dependencies
midir = "0.8"  # For MIDI ports

# Additional dependencies
dirs = "5.0"   # For working with configuration directories

[features]
# Отладочная сборка плагина, которая падает на любой аллокации в process():
#   cargo build --features assert_process_allocs
assert_process_allocs = ["nih_plug/assert_process_allocs"]

[dev-dependencies]
tempfile = "3.0"   # For temporary files in tests

# VST3 plugin library
[lib]
name = "vst_midi_curves"
crate-type = ["cdylib", "rlib"]

# Standalone application
[[bin]]
name = "midi_curves"
path = "src/main.rs"

[profile.release]
lto = "fat"
opt-level = 3
codegen-units = 1
panic = "abort"
strip = true   # −13% size; the exported VST3/CLAP entry points stay
